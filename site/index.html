<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#070d15" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
<link rel="modulepreload" href="atlas.js" />
<meta name="description" content="Watch the Sun travel through the zodiac in an interactive 3D sky." />
<meta property="og:title" content="Celestial Atlas" />
<meta property="og:description" content="Watch the Sun travel through the zodiac in an interactive 3D sky." />
<meta property="og:image" content="https://alephhnull.github.io/celestial-atlas/preview.jpg" />
<meta property="og:type" content="website" />
<title>Celestial Atlas — The Sun's Apparent Journey</title>
<style>
:root{--bg:#060c14;--ink:#eeeae1;--muted:#8f9ca8;--gold:#d6b57c;--ice:#8dbdc9;--hair:rgba(203,215,226,.13);--glass:rgba(9,17,27,.82)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#atlas{position:relative;height:100dvh;min-height:590px;width:100%;isolation:isolate;background:radial-gradient(ellipse at 58% 38%,#0c1c2d 0%,#080f1b 39%,#050a11 80%)}
#stage{position:absolute;inset:0;z-index:0}#stage canvas{display:block;width:100%;height:100%;outline:none}
#vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 62% 70% at 53% 43%,transparent 18%,rgba(3,8,14,.22) 80%),linear-gradient(90deg,rgba(5,10,17,.55) 0%,transparent 40%,rgba(5,10,17,.1) 100%)}
.ui{position:absolute;z-index:2;pointer-events:none}.ui>*{pointer-events:auto}

.topControls{top:34px;right:36px;display:flex;gap:8px;align-items:center}.segment{display:flex;gap:3px;border:1px solid rgba(203,215,226,.18);padding:4px;background:rgba(8,15,24,.83);backdrop-filter:blur(14px);border-radius:7px}.mode,.quietBtn{border:0;background:transparent;color:#94a4b0;font-size:10px;letter-spacing:.11em;font-weight:700;text-transform:uppercase;padding:11px 15px;border-radius:4px;transition:.2s}.mode.active{background:rgba(213,179,120,.14);color:#e7ca99;box-shadow:inset 0 0 0 1px rgba(213,179,120,.16)}.mode:hover,.quietBtn:hover{color:white}.quietBtn{background:rgba(8,15,24,.83);border:1px solid rgba(203,215,226,.18);padding:14px 13px}

.legendItem{display:flex;gap:9px;align-items:center;font-size:10px;letter-spacing:.02em;color:#acb7bc;white-space:nowrap}.swatch{height:1px;width:25px;background:var(--gold);box-shadow:0 0 7px rgba(214,181,124,.38)}.swatch.blue{background:var(--ice);box-shadow:0 0 7px rgba(141,189,201,.4)}.swatch.dot{height:0;border-top:1px dashed #c2af81;background:transparent}
#skyTools.active{display:flex}.skyBtn{border:0;border-radius:3px;background:transparent;padding:9px 12px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#91a5b2}.skyBtn.active{background:rgba(214,181,124,.16);color:#edcc92}
#scrubber{width:100%;height:3px;appearance:none;background:linear-gradient(to right,var(--gold) 0%,var(--gold) var(--progress,0%),rgba(131,155,171,.25) var(--progress,0%));cursor:pointer;border-radius:2px;outline:none}#scrubber::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border:2px solid #e6cb97;background:#0d1b28;border-radius:100%;box-shadow:0 0 11px rgba(230,203,151,.4)}#scrubber::-moz-range-thumb{width:10px;height:10px;border:2px solid #e6cb97;background:#0d1b28;border-radius:100%}
#hint strong{color:#b3c2c9;font-weight:500}#loading{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#070c14;font-size:13px;letter-spacing:.1em;color:#afbdc6;transition:opacity .6s}#loading.hide{opacity:0;pointer-events:none}.arcMark{position:absolute;top:45%;left:50%;height:1px;width:160px;background:linear-gradient(90deg,transparent,rgba(214,181,124,.7),transparent);opacity:.3;transform:translate(-50%,-50%)}
@media(max-width:860px){.topControls{right:18px;top:24px}.mode{padding:10px}.quietBtn{padding:12px 10px}}
@media(max-width:570px){#fullBtn{display:none}#atlas{min-height:620px}.topControls{top:17px;right:11px;gap:4px}.segment{padding:2px}.mode,.quietBtn{font-size:8px;padding:9px 8px}.legendItem{font-size:8px}.swatch{width:17px}.skyBtn{padding:8px;font-size:8px}}
/* Legend, sky tools and hint sit just above the compact year bar */
#legend{left:28px;bottom:104px;display:flex;gap:20px;align-items:center;opacity:.85}
#skyTools{right:28px;bottom:100px;display:none;align-items:center;gap:6px;background:rgba(8,15,24,.8);border:1px solid var(--hair);padding:5px;border-radius:9px;backdrop-filter:blur(10px)}#skyTools.active{display:flex}
#hint{position:absolute;z-index:2;pointer-events:none;bottom:128px;left:28px;font-size:10px;color:#748895;letter-spacing:.08em}#hint strong{color:#b3c2c9;font-weight:500}
/* Compact year bar: play · date + sign · scrubber · months */
#bottom{position:absolute;z-index:3;left:50%;bottom:20px;transform:translateX(-50%);width:min(680px,calc(100% - 24px));display:flex;align-items:center;gap:14px;padding:9px 16px 7px 10px;border:1px solid rgba(196,209,222,.14);background:rgba(8,14,23,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.play{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(213,179,120,.42);background:rgba(213,179,120,.09);color:#ecd09c;font-size:12px;line-height:1;transition:background .2s}.play:hover{background:rgba(213,179,120,.18)}
.track{flex:1;min-width:0}
.timeRead{display:flex;align-items:center;gap:7px;margin:0 0 6px 1px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#e9cb94;white-space:nowrap}.timeRead svg{width:13px;height:13px;flex:none;filter:drop-shadow(0 0 4px rgba(233,190,120,.6))}.timeRead span{color:#8d9eaa;font-weight:500}
#scrubber{display:block;width:100%;margin:0}
.months{display:grid;grid-template-columns:repeat(12,1fr);margin-top:4px}
.month{border:0;background:transparent;padding:4px 0 2px;color:#6f8493;font-size:9px;font-weight:700;letter-spacing:.05em;text-align:center;transition:color .2s}.month:hover{color:#c9d3d9}.month.active{color:#ecc98d}
@media(max-width:860px){#legend{left:16px;bottom:96px;gap:7px;flex-direction:column;align-items:flex-start}#skyTools{right:12px;bottom:96px}#hint{display:none}}
@media(max-width:570px){#bottom{bottom:18px;gap:10px;padding:8px 10px 6px 8px;border-radius:14px}.play{width:36px;height:36px}.timeRead{font-size:10px}.month{font-size:8px;letter-spacing:0}.legendItem{font-size:8px}.swatch{width:17px}.skyBtn{padding:8px;font-size:8px}}
/* Telegram Mini App: fit Telegram's viewport and keep UI clear of its header/safe areas */
:root{--safe-top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));--safe-bottom:calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px))}
#atlas{height:var(--tg-viewport-stable-height,100dvh)}
.topControls{margin-top:var(--safe-top)}
#legend,#skyTools,#hint,#bottom,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
<script async id="tgSdk" src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main id="atlas" aria-label="Interactive three-dimensional celestial atlas">
  <div id="stage"></div><div id="vignette"></div>
  <div id="loading">ASSEMBLING THE CELESTIAL SPHERE<div class="arcMark"></div></div>
  <div class="ui topControls">
    <div class="segment" role="group" aria-label="Perspective"><button id="orbitMode" class="mode active" aria-pressed="true">Outside view</button><button id="earthMode" class="mode" aria-pressed="false">From Earth</button></div>
    <button id="fullBtn" class="quietBtn" title="Toggle fullscreen">Full screen</button>
  </div>
  <div id="legend" class="ui" aria-label="Color key"><span class="legendItem"><i class="swatch"></i>Ecliptic / apparent solar path</span><span class="legendItem"><i class="swatch blue"></i>Earth's orbit</span><span class="legendItem"><i class="swatch dot"></i>Line of sight</span></div>
  <div id="skyTools" class="ui" role="group" aria-label="Earth sky camera"><button id="trackBtn" class="skyBtn active">Follow Sun</button><button id="fixedBtn" class="skyBtn">Fix sky</button></div>
  <div id="hint"> <strong>Drag</strong> to rotate · <strong>Scroll</strong> to zoom · Select any month</div>
  <section id="bottom" aria-label="Move through the solar year"><button id="play" class="play" title="Play or pause the year" aria-label="Play animation">▶</button><div class="track"><div id="timeRead" class="timeRead" aria-live="polite"></div><input id="scrubber" type="range" min="0" max="11.999" step="0.005" value="0" aria-label="Solar year position"/><div id="months" class="months"></div></div></section>
</main>
<script type="module" src="atlas.js"></script>
</body></html>
