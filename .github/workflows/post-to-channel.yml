name: Post Atlas button to a channel

# Run by hand from the Actions tab. Sends one photo post with an "Open" button to your channel.
# Needs: the bot added as a channel admin, and the bot token saved as the BOT_TOKEN repository secret.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel username, e.g. @mychannel
        required: true
      caption:
        description: Post text
        required: true
        default: "✨ Watch the Sun travel through the zodiac in 3D. Tap below to open the Celestial Atlas."
      button:
        description: Button text
        required: true
        default: "✨ Open Celestial Atlas"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send post with button
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          CAPTION: ${{ inputs.caption }}
          BUTTON: ${{ inputs.button }}
          PHOTO: https://alephhnull.github.io/celestial-atlas/preview.jpg
          APP_LINK: https://t.me/celestial3datlasbot?startapp
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "Add the BOT_TOKEN repository secret first."; exit 1; fi
          jq -n --arg chat "$CHANNEL" --arg cap "$CAPTION" --arg photo "$PHOTO" --arg text "$BUTTON" --arg url "$APP_LINK" \
            '{chat_id: $chat, photo: $photo, caption: $cap, reply_markup: {inline_keyboard: [[{text: $text, url: $url}]]}}' \
          | curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
              -H 'Content-Type: application/json' -d @- -o response.json \
          || { cat response.json; exit 1; }
          jq '{ok, message_id: .result.message_id}' response.json
